<div class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="auth-card__brand"><span class="brand__mark">S</span></div>
    <h1>Create an account</h1>
    <p class="muted">It takes less than a minute.</p>

    @if (formError(); as error) {
      <div class="alert alert--error">{{ error }}</div>
    }

    <label class="field">
      <span>Full name</span>
      <input type="text" formControlName="name" autocomplete="name" />
      <app-field-error [control]="form.controls.name" label="Name" />
    </label>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
      <app-field-error [control]="form.controls.email" label="Email" />
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      <small class="hint">At least 8 characters, with letters and numbers.</small>
      <app-field-error [control]="form.controls.password" label="Password" />
    </label>

    <label class="field">
      <span>Confirm password</span>
      <input type="password" formControlName="password_confirmation" autocomplete="new-password" />
      <app-field-error [control]="form.controls.password_confirmation" label="Confirmation" />
      @if (form.hasError('fieldsMismatch') && form.controls.password_confirmation.touched) {
        <small class="field-error">The passwords do not match.</small>
      }
    </label>

    <button type="submit" class="btn btn--primary btn--block" [disabled]="saving()">
      {{ saving() ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="muted center">Already registered? <a routerLink="/login">Log in</a></p>
  </form>
</div>
