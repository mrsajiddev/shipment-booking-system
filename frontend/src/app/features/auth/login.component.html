<div class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="auth-card__brand"><span class="brand__mark">S</span></div>
    <h1>Log in</h1>
    <p class="muted">Book and track your parcels.</p>

    @if (formError(); as error) {
      <div class="alert alert--error">{{ error }}</div>
    }

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
      <app-field-error [control]="form.controls.email" label="Email" />
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      <app-field-error [control]="form.controls.password" label="Password" />
    </label>

    <button type="submit" class="btn btn--primary btn--block" [disabled]="saving()">
      {{ saving() ? 'Logging in…' : 'Log in' }}
    </button>

    <div class="demo">
      <span class="muted">Try a demo account:</span>
      <button type="button" class="btn btn--ghost btn--sm" (click)="useDemo('customer')">Customer</button>
      <button type="button" class="btn btn--ghost btn--sm" (click)="useDemo('admin')">Admin</button>
    </div>

    <p class="muted center">No account yet? <a routerLink="/register">Create one</a></p>
  </form>
</div>
